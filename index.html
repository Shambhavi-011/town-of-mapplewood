        <h1>Town of Maplewood Municipal Directory (Offline &amp; Scraper Fallback)</h1>
        <p>JavaScript is disabled or not executed by your crawler. Below is the full index of municipal services, tax due dates, permit regulations, and official by-laws:</p>
        
        <h2>Emergency Hotlines (24/7)</h2>
        <ul>
          <li>Police / Fire / Ambulance: 911</li>
          <li>Roads &amp; Snow Dispatch: (555) 123-7623</li>
          <li>Water &amp; Sewer Main Emergency: (555) 123-9287</li>
          <li>Downed Wires &amp; Hydro One / Maplewood Utilities: 1-800-434-1235</li>
          <li>Citizen Helpline: Dial 311 or (555) 123-4567</li>
        </ul>

        <h2>Municipal Services &amp; Rules</h2>
        <ul>
          <li><a href="/services/public-works">Department of Public Works (DPW) &amp; Recycling Center</a>: 359 Boyden Avenue (Phone: 973-762-1175). Weekdays 8:00 AM–3:00 PM, Saturdays 8:00 AM–12:00 PM. Dual-stream recycling by section (Sec 1-2 Mon, Sec 3-4 Tue, Sec 5-6 Wed), biannual bulk drop-off days (furniture, mattresses, MRPs with 2 Maplewood IDs; no construction debris), 4 rotating fall curbside leaf pickup rounds (zero plastic bags, gas-powered leaf blowers banned), spring rake-out (max 4-foot branch bundles), street sweeping, tree removal permits (&gt;8-inch diameter), Jitney commuter train shuttle ($95/yr), free mulch/compost, and electronics e-waste depot.</li>
          <li><a href="/services/waste">Waste &amp; Recycling</a>: Curbside placement by 7:00 AM on collection day. Missed collections reported strictly after 5:00 PM. 2-day resolution SLA. Green bin weekly, blue box bi-weekly, garbage bi-weekly (max 2 bags without tag, $3/additional tag). Bulk pickup first Tuesday of each month (max 2 items).</li>
          <li><a href="/services/roads">Roads &amp; Potholes</a>: Exact address or cross-street intersection required. Size categories: Small (&lt;25cm), Medium (25-60cm), Large (&gt;60cm). Large potholes in travel lanes are High Severity (24h repair). Duplicate detection within 50 meters and 30 days. Streetlight pole tags (e.g. Pole ML-0412).</li>
          <li><a href="/services/parks">Parks &amp; Forestry</a>: 18 parks, 35 km trails. Boulevard trees maintained by Town; private property trees maintained by owner under By-law 2023-45.</li>
          <li><a href="/services/water">Water Services</a>: Maplewood Aquifer supply. Conservation by-law May 15 to Sept 15: alternate day odd/even watering only 6-8 AM &amp; 7-9 PM.</li>
          <li><a href="/services/snow">Snow Removal &amp; Snow Emergency Routes</a>: Chapter 257 (§ 257-36.7 &amp; § 257-2.5) emergency no-parking regulations on 22 designated corridors (Valley St, Wyoming Ave, Ridgewood Rd, Springfield Ave, Boyden Ave, Parker Ave, Maplewood Ave, Baker St, Prospect St, Tuscan Rd, Burnett Ave, Elmwood Ave, Harvard Ave, Jefferson Ave, Clinton Ave, Hilton Ave, Dunnell Rd, Oakview Ave, Meadowbrook Pl, Claremont Ave, Highland Ave, Indiana St). Unoccupied vehicles towed under § 257-31. Sidewalk snow and ice clearing within 24 hours (§ 239-1); depositing snow into plowed public streets prohibited (§ 239-2). Overnight parking ban 2:00 AM to 6:00 AM.</li>
          <li><a href="/services/animals">Animal Control</a>: Dog licensing $30 spayed/neutered, $45 intact. Maximum 2.0m leash in public spaces (By-law 2020-04).</li>
        </ul>

        <h2>Property Taxes &amp; Assessments</h2>
        <ul>
          <li><a href="/taxes/info">Property Taxes</a>: 2026 Residential Mill Rate is 0.0094523 (48% Municipal, 34% Regional, 18% Education). Interim due dates: Feb 27 and Apr 30, 2026. Final due dates: June 30 and Sept 30, 2026.</li>
          <li><a href="/taxes/payment">Payment Methods</a>: Online banking (Payee: "Town of Maplewood - Property Taxes", 19-digit Roll Number), Pre-authorized debit, in-person at 123 Main St, 24/7 North drop box.</li>
          <li><a href="/taxes/pre-authorized">Pre-Authorized Debit</a>: 10-month monthly plan or 4-instalment automatic due-date plan.</li>
          <li><a href="/taxes/calculator">Tax Calculator</a>: Online estimator using 0.0094523 rate.</li>
        </ul>

        <h2>Building &amp; Planning Permits</h2>
        <ul>
          <li><a href="/permits/decks">Deck Permits</a>: Freestanding decks &lt;60 cm (24 in) and &lt;10 m² (108 sq ft) are EXEMPT from permits. Attached decks or decks &gt;60 cm require building permits ($185 fee, setbacks: 1.5m rear / 1.2m side).</li>
          <li><a href="/permits/pools">Pool Enclosures (By-law 2022-18)</a>: Required for water &gt;60 cm depth. Minimum 1.5 m (5.0 ft) fence height, self-closing and self-latching gate at 1.35m latch height. ASTM F1346 locking hot tub covers exempt. Fee: $150.</li>
          <li><a href="/permits/burn">Open-Air Burn Permits</a>: Rural zones (A-1, RU) and County Rd 8 only. Max pile 2m x 2m x 1m. Adult 18+ with water. Sunrise to sunset. Prohibited during fire bans. Fee: $25.</li>
          <li><a href="/permits/building">Building Permits</a>: Additions, renovations, accessory structures &gt;15 m². 10-day review timeline.</li>
          <li><a href="/permits/signs">Signage Permits</a>: Commercial fascia, pylon, and $50 annual sidewalk A-frame sandwich boards (By-law 2021-34).</li>
        </ul>

        <h2>Documents, By-laws &amp; Council Minutes</h2>

          <li><a href="/documents/fees">Master Fee Schedule</a>: Complete schedule of municipal fees under By-law 2026-02.</li>
