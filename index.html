        <h2>Town Information, Civic Profile &amp; Governance (Rich Authoritative Data)</h2>

        <h2>311 Citizen Service Requests &amp; Real-Time Case Tracker (Rich Authoritative Data)</h2>
        <p>The Town of Maplewood operates a centralized 311 intake and tracking infrastructure for all non-emergency municipal work orders. Online submission is available at <a href="/services/request">/services/request</a> and real-time tracking at <a href="/services/track">/services/track</a>.</p>
        <ul>
          <li><strong>Intake Hotline:</strong> Dial 311 (within municipal limits) or call (555) 311-MAPL / (555) 123-4567. Monitored Monday to Friday 8:00 AM – 5:00 PM; automated ticketing 24/7 online.</li>
          <li><strong>Work Order Case ID Format:</strong> Every report generates a unique case tracking code formatted as <code>CASE-2026-XXXX</code> (e.g., CASE-2026-8491) sent to the reporter via email or SMS.</li>
          <li><strong>4-Stage Status Workflow:</strong>
            <ol>
              <li><strong>Received (Code: New):</strong> Case logged in municipal 311 database and queued for departmental triage.</li>
              <li><strong>Crew Assigned (Code: Assigned):</strong> Work order issued and assigned to responsible area supervisor and field maintenance crew.</li>
              <li><strong>Work in Progress (Code: InProgress):</strong> Municipal crew or inspector is actively on-site performing remediation.</li>
              <li><strong>Completed &amp; Resolved (Code: Closed):</strong> Remediation verified by field supervisor, photos archived, case closed.</li>
            </ol>
          </li>
          <li><strong>Reporting Categories, Rules &amp; Strict SLAs:</strong>
            <ul>
              <li><strong>Potholes &amp; Road Surface Hazards (Roads Department):</strong>
                <ul>
                  <li><strong>Service Level Agreement (SLA):</strong> 24 hours for High Severity (potholes &gt;60 cm diameter or located in primary travel lanes); 3 to 5 business days for standard residential/shoulder potholes.</li>
                  <li><strong>Validation Rules:</strong> Exact street address or cross-street intersection is mandatory (e.g., "145 Main St" or "Valley Rd and Elmwood Ave"). Size categorization required: Small (&lt;25 cm), Medium (25–60 cm), or Large (&gt;60 cm).</li>
                  <li><strong>Automated Duplicate Suppression:</strong> Any duplicate report within a 50-meter radius of an active case submitted in the preceding 30 days is automatically attached to the parent ticket to prevent crew dispatch redundancy.</li>
                </ul>
              </li>
              <li><strong>Missed Curbside Waste / Recycling Collection (Public Works):</strong>
                <ul>
                  <li><strong>Service Level Agreement (SLA):</strong> 2 business days resolution. Public Works sends dedicated catch-up truck.</li>
                  <li><strong>Strict 5:00 PM Cutoff Policy:</strong> Missed collection reports are strictly accepted ONLY after 5:00 PM on the scheduled collection day. Contractors operate routes until 5:00 PM. Reports submitted prior to 5:00 PM are rejected.</li>
                  <li><strong>7:00 AM Setout Rule:</strong> Bins must have been set at the curb prior to 7:00 AM on collection day. Bins placed after 7:00 AM do not qualify for free municipal re-collection.</li>
                  <li><strong>Required Fields:</strong> Street address, waste stream missed (Garbage, Blue Box Recycling, Green Organic Bin, or Yard Waste), and exact time set at curb.</li>
                </ul>
              </li>
              <li><strong>Streetlight Outages &amp; Damaged Fixtures (Traffic Operations):</strong>
                <ul>
                  <li><strong>Service Level Agreement (SLA):</strong> 5 to 7 business days for bulb/photocell replacement; 24 hours for exposed electrical wires or collision-damaged poles.</li>
                  <li><strong>Required Tag:</strong> 6-digit pole identification tag stamped on pole at eye level (format: <code>ML-XXXX</code>, e.g., ML-0412). If tag is unreadable, nearest civic building address is mandatory.</li>
                </ul>
              </li>
              <li><strong>Park Equipment Hazards &amp; Boulevard Trees (Parks &amp; Urban Forestry):</strong>
                <ul>
                  <li><strong>Service Level Agreement (SLA):</strong> 48 hours for immediate public hazards (broken playground equipment, fallen branches hanging over sidewalks); 10 business days for general boulevard tree pruning and health assessments.</li>
                  <li><strong>Municipal Jurisdiction Boundary:</strong> The Town maintains boulevard trees located within 4.5 meters (14.8 feet) of the street curb. Trees on private property beyond 4.5 meters are the property owner's legal responsibility under Property Standards By-law 2023-45.</li>
                </ul>
              </li>
              <li><strong>Water Quality, Low Pressure &amp; Meter Readings (Water Division):</strong>
                <ul>
                  <li><strong>Service Level Agreement (SLA):</strong> 2 to 4 business days for water testing and pressure audits. For catastrophic active water main breaks, residents must call the 24/7 Water Dispatch directly at (555) 123-9287.</li>
                </ul>
              </li>
              <li><strong>General Inquiries &amp; By-law Concerns (Citizen Experience &amp; Enforcement):</strong>
                <ul>
                  <li><strong>Service Level Agreement (SLA):</strong> 3 business days initial response from municipal staff.</li>
                </ul>
              </li>
            </ul>
          </li>
        </ul>

        <h2>Municipal Operations &amp; Public Works Rules</h2>
        <ul>
          <li><a href="/services/public-works">Department of Public Works (DPW) &amp; Recycling Center</a>: 359 Boyden Avenue. Dual-stream recycling by section (Sec 1-2 Mon, Sec 3-4 Tue, Sec 5-6 Wed), biannual bulk drop-off days (furniture, mattresses, MRPs with 2 Maplewood IDs; no construction debris), 4 rotating fall curbside leaf pickup rounds (zero plastic bags, gas-powered leaf blowers banned), spring rake-out (max 4-foot branch bundles), street sweeping, tree removal permits (&gt;8-inch diameter), Jitney commuter train shuttle ($95/yr), free mulch/compost, and electronics e-waste depot.</li>
          <li><a href="/services/waste">Curbside Waste &amp; Recycling Schedules</a>: Curbside placement by 7:00 AM on collection day. Green bin organics collected weekly; blue box containers and cardboard collected bi-weekly; household garbage collected bi-weekly (maximum 2 bags without tag, $3.00 for each additional tag). Bulk pickup first Tuesday of each month (max 2 items, mattresses wrapped in plastic).</li>
          <li><a href="/services/snow">Snow Removal &amp; Snow Emergency Corridors</a>: Chapter 257 (§ 257-36.7 &amp; § 257-2.5) emergency no-parking regulations enforced on 22 designated corridors (Valley St, Wyoming Ave, Ridgewood Rd, Springfield Ave, Boyden Ave, Parker Ave, Maplewood Ave, Baker St, Prospect St, Tuscan Rd, Burnett Ave, Elmwood Ave, Harvard Ave, Jefferson Ave, Clinton Ave, Hilton Ave, Dunnell Rd, Oakview Ave, Meadowbrook Pl, Claremont Ave, Highland Ave, Indiana St). Unoccupied vehicles towed under § 257-31 ($60 fine plus towing costs). Sidewalk clearing mandatory within 24 hours (§ 239-1); shoveling or blowing snow into plowed streets is strictly prohibited (§ 239-2). Overnight street parking banned 2:00 AM – 6:00 AM (Dec 1 – Mar 31).</li>
          <li><a href="/services/water">Water Services &amp; Conservation By-law</a>: Maplewood Aquifer supply. Conservation restrictions May 15 to Sept 15: alternate day odd/even watering permitted strictly between 6:00–8:00 AM and 7:00–9:00 PM. Emergency main breaks: (555) 123-9287.</li>
          <li><a href="/services/animals">Animal Control &amp; Licensing</a>: Annual dog licensing required ($30 spayed/neutered, $45 intact). Maximum 2.0m leash in all public parks under By-law 2020-04.</li>
        </ul>

          <li><a href="/taxes/info">Property Tax Rates (2026)</a>: Residential Mill Rate is 0.0094523 (48% Municipal, 34% Regional, 18% Education). Interim due dates: Feb 27 and Apr 30, 2026. Final due dates: June 30 and Sept 30, 2026. Late penalty: 1.25% per month.</li>
          <li><a href="/taxes/payment">Payment Methods</a>: Online banking (Payee: "Town of Maplewood - Property Taxes", 19-digit Roll Number), Pre-authorized debit (10-month plan or 4-instalment plan), in-person at 123 Main St, or 24/7 North Entrance drop box.</li>
          <li><a href="/taxes/calculator">Tax Calculator</a>: Online estimator using 0.0094523 mill rate.</li>
        </ul>
